name: PMC Jira Sync

on:
  workflow_call:
    inputs:
      trigger_label:
        type: string
        default: 'PrincipalWP Optimizer'
      project_key:
        type: string
        default: 'PUB'
      issue_type:
        type: string
        default: 'Task'
      done_transition:
        type: string
        default: 'Done'
      declined_transition:
        type: string
        default: "Won't Do"
      summary_prefix:
        type: string
        default: 'ENG Auto maintenance: '
      labels_field:
        description: 'Jira field id that receives the Auto-maintenance label. PUB has no system Labels field on its create screens; its label-type "Tags" field is customfield_10057.'
        type: string
        default: 'customfield_10057'
      brands_affected:
        description: 'PUB "Brands Affected" (customfield_10046, required multi-select). Comma-separated option values.'
        type: string
        default: 'Core Theme / Core Tech'
      business_area:
        description: 'PUB "Brand / Business Area" (customfield_10049, required select). Single option value.'
        type: string
        default: 'Core Tech/ Product'
    secrets:
      JIRA_API_TOKEN:
        required: true
      JIRA_EMAIL:
        required: true
      JIRA_CLOUD_ID:
        required: true

permissions:
  contents: read
  pull-requests: write

env:
  JIRA_API: https://api.atlassian.com/ex/jira/${{ secrets.JIRA_CLOUD_ID }}/rest/api/3
  JIRA_AUTH: ${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}
  GH_TOKEN: ${{ github.token }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  create-ticket:
    name: Create Jira ticket
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == inputs.trigger_label &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Create Jira ticket unless one already exists
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PROJECT_KEY: ${{ inputs.project_key }}
          ISSUE_TYPE: ${{ inputs.issue_type }}
          SUMMARY_PREFIX: ${{ inputs.summary_prefix }}
          LABELS_FIELD: ${{ inputs.labels_field }}
          BRANDS_AFFECTED: ${{ inputs.brands_affected }}
          BUSINESS_AREA: ${{ inputs.business_area }}
        run: |
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- jira-key:"))) | .id' | head -n1)
          if [ -n "$existing" ]; then
            echo "Ticket already linked; skipping."
            exit 0
          fi

          payload=$(jq -n \
            --arg project "$PROJECT_KEY" --arg type "$ISSUE_TYPE" \
            --arg labels_field "$LABELS_FIELD" \
            --arg brands "$BRANDS_AFFECTED" --arg area "$BUSINESS_AREA" \
            --arg prefix "$SUMMARY_PREFIX" --arg title "$PR_TITLE" --arg url "$PR_URL" '{
              fields: {
                project: {key: $project},
                issuetype: {name: $type},
                summary: (($prefix + $title) | .[0:255]),
                ($labels_field): ["Auto-maintenance"],
                customfield_10046: ($brands | split(",") | map({value: (. | gsub("^\\s+|\\s+$"; ""))})),
                customfield_10049: {value: $area},
                description: {type: "doc", version: 1, content: [
                  {type: "paragraph", content: [
                    {type: "text", text: "Pull request: "},
                    {type: "text", text: $url, marks: [{type: "link", attrs: {href: $url}}]}
                  ]}
                ]}
              }}')

          http_code=$(curl -sS -o "$RUNNER_TEMP/jira-response.json" -w '%{http_code}' -u "$JIRA_AUTH" \
            -H 'Content-Type: application/json' -X POST \
            -d "$payload" "$JIRA_API/issue")
          if [ "$http_code" -ge 300 ]; then
            echo "Jira returned HTTP $http_code creating the issue:"
            cat "$RUNNER_TEMP/jira-response.json"
            echo
            exit 1
          fi
          key=$(jq -r '.key' "$RUNNER_TEMP/jira-response.json")
          if [ -z "$key" ] || [ "$key" = "null" ]; then
            echo "No issue key returned from Jira"
            exit 1
          fi

          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
            --body "Jira ticket created: **$key**
          <!-- jira-key:$key -->"

  close-ticket:
    name: Close Jira ticket
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Move linked ticket to Done (merged) or Won't Do (closed unmerged)
        env:
          MERGED: ${{ github.event.pull_request.merged }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PROJECT_KEY: ${{ inputs.project_key }}
          DONE_NAME: ${{ inputs.done_transition }}
          DECLINED_NAME: ${{ inputs.declined_transition }}
        run: |
          key=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
            | grep -oE "<!-- jira-key:${PROJECT_KEY}-[0-9]+ -->" | head -n1 \
            | sed -E 's/.*jira-key:([^ ]+) .*/\1/')
          if [ -z "$key" ]; then
            echo "No linked ticket; nothing to do."
            exit 0
          fi

          if [ "$MERGED" = "true" ]; then
            target="$DONE_NAME"
          else
            target="$DECLINED_NAME"
          fi

          tid=$(curl -sS --fail-with-body -u "$JIRA_AUTH" "$JIRA_API/issue/$key/transitions" \
            | jq -r --arg n "$target" '.transitions[] | select(.name | ascii_downcase == ($n | ascii_downcase)) | .id' | head -n1)

          if [ -n "$tid" ]; then
            curl -sS --fail-with-body -u "$JIRA_AUTH" -H 'Content-Type: application/json' -X POST \
              -d "$(jq -n --arg id "$tid" '{transition: {id: $id}}')" \
              "$JIRA_API/issue/$key/transitions"
            exit 0
          fi

          echo "No '$target' transition available for $key."
          if [ "$MERGED" != "true" ]; then
            body=$(jq -n --arg url "$PR_URL" '{body: {type: "doc", version: 1, content: [
              {type: "paragraph", content: [
                {type: "text", text: "Pull request was closed without merging: "},
                {type: "text", text: $url, marks: [{type: "link", attrs: {href: $url}}]}
              ]}
            ]}}')
            curl -sS --fail-with-body -u "$JIRA_AUTH" -H 'Content-Type: application/json' -X POST \
              -d "$body" "$JIRA_API/issue/$key/comment"
          fi
